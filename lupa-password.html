<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<title>Lupa Password - SkipAntre</title><link rel="stylesheet" href="css/style.css"></head>
<body class="hal-auth">
<main class="container">
  <div class="kartu kartu-auth">
    <a class="tombol-kembali" href="login.html" aria-label="Kembali"></a>
    <a class="auth-merek" href="index.html">
      <img src="img/logo-smkn1.png" alt="Logo" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'logo-kosong',style:'width:44px;height:44px'}))">
      <span class="merek-teks"><b>Skip<span>Antre</span></b><small>Kantin SMKN 1 Cimahi</small></span>
    </a>
    <h1 class="auth-judul">Lupa Password?</h1>
    <p class="auth-sub lembut">Masukkan email akunmu. Kami kirim tautan untuk membuat password baru.</p>
    <div id="pesan" class="status-kotak" hidden></div>
    <form id="form">
      <div class="field"><label for="email">Email</label><input class="input" id="email" name="email" type="email" placeholder="Email" autocomplete="email" required></div>
      <button class="tombol tombol-utama tombol-penuh" type="submit">Kirim tautan reset</button>
    </form>
    <p class="auth-kaki">Sudah ingat? <a href="login.html">Kembali masuk</a></p>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/ui.js"></script>
<script src="js/guard.js"></script>
<script src="js/auth.js"></script>
<script>
  const form = document.getElementById('form');
  const pesan = document.getElementById('pesan');

  function mulaiJeda(tombol) {
    let detik = 60;
    tombol.disabled = true;
    tombol.textContent = 'Kirim ulang dalam ' + detik + ' detik';
    const t = setInterval(() => {
      detik--;
      if (detik <= 0) { clearInterval(t); tombol.disabled = false; tombol.textContent = 'Kirim tautan lagi'; }
      else tombol.textContent = 'Kirim ulang dalam ' + detik + ' detik';
    }, 1000);
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const tombol = form.querySelector('button[type=submit]');
    pesan.hidden = true;
    tombolSibuk(tombol, true, 'Mengirim...');
    const { error } = await db.auth.resetPasswordForEmail(form.elements.email.value.trim(), {
      redirectTo: AKAR + 'atur-password.html'
    });
    if (error) {
      const m = (error.message || '').toLowerCase();
      if (m.includes('only request this after')) tampilPesan(pesan, 'Tunggu sekitar satu menit sebelum meminta tautan lagi.', 'gagal');
      else if (m.includes('not authorized')) tampilPesan(pesan, 'Pengiriman email belum diatur. Hubungi pengelola kantin.', 'gagal');
      else tampilPesan(pesan, pesanError(error), 'gagal');
      return tombolSibuk(tombol, false);
    }
    tampilPesan(pesan, 'Jika email itu terdaftar, tautan untuk membuat password baru sudah dikirim. Cek kotak masuk dan folder spam.', 'ok');
    mulaiJeda(tombol);
  });

  pasangHeader();
</script>
</body></html>
