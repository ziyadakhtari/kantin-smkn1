<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<title>Lupa Password - Kantin SMKN 1 Cimahi</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<main class="container">
  <div class="kartu" style="max-width:440px;margin:24px auto">
    <h1 style="font-size:1.8rem">Lupa password</h1>
    <p class="lembut">Masukkan email akunmu. Kami kirim tautan untuk membuat password baru.</p>
    <div id="pesan" class="status-kotak" hidden></div>
    <form id="form">
      <div class="field"><label for="email">Email</label><input class="input" id="email" name="email" type="email" autocomplete="email" required></div>
      <button class="tombol tombol-utama tombol-penuh" type="submit">Kirim tautan reset</button>
    </form>
    <p style="margin:16px 0 0" class="lembut"><a href="login.html">Kembali ke halaman masuk</a></p>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/ui.js"></script>
<script src="js/guard.js"></script>
<script src="js/auth.js"></script>
<script>
  const form = document.getElementById('form');
  const pesan = document.getElementById('pesan');

  // Tombol dikunci 60 detik setelah berhasil kirim (sesuai batas per pengguna dari Supabase)
  function mulaiJeda(tombol) {
    let detik = 60;
    tombol.disabled = true;
    tombol.textContent = 'Kirim ulang dalam ' + detik + ' detik';
    const t = setInterval(() => {
      detik--;
      if (detik <= 0) { clearInterval(t); tombol.disabled = false; tombol.textContent = 'Kirim tautan lagi'; }
      else tombol.textContent = 'Kirim ulang dalam ' + detik + ' detik';
    }, 1000);
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const tombol = form.querySelector('button[type=submit]');
    pesan.hidden = true;
    tombolSibuk(tombol, true, 'Mengirim...');
    const { error } = await db.auth.resetPasswordForEmail(form.elements.email.value.trim(), {
      redirectTo: AKAR + 'atur-password.html'
    });
    if (error) {
      const m = (error.message || '').toLowerCase();
      if (m.includes('only request this after')) tampilPesan(pesan, 'Tunggu sekitar satu menit sebelum meminta tautan lagi.', 'gagal');
      else if (m.includes('not authorized')) tampilPesan(pesan, 'Pengiriman email belum diatur. Hubungi pengelola kantin.', 'gagal');
      else tampilPesan(pesan, pesanError(error), 'gagal');
      return tombolSibuk(tombol, false);
    }
    // Pesan sengaja sama untuk email terdaftar maupun tidak, agar orang tidak bisa menebak email siapa yang terdaftar
    tampilPesan(pesan, 'Jika email itu terdaftar, tautan untuk membuat password baru sudah dikirim. Cek kotak masuk dan folder spam.', 'ok');
    mulaiJeda(tombol);
  });

  pasangHeader();
</script>
</body></html>
