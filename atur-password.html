<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<title>Atur Password Baru - Kantin SMKN 1 Cimahi</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<main class="container">
  <div class="kartu" style="max-width:440px;margin:24px auto">
    <h1 style="font-size:1.8rem">Atur password baru</h1>
    <div id="tunggu"></div>
    <div id="pesan" class="status-kotak" hidden></div>
    <form id="form" hidden>
      <div class="field"><label for="password">Password baru (minimal 8 karakter)</label><input class="input" id="password" name="password" type="password" minlength="8" autocomplete="new-password" required></div>
      <div class="field"><label for="password2">Ulangi password baru</label><input class="input" id="password2" name="password2" type="password" minlength="8" autocomplete="new-password" required></div>
      <button class="tombol tombol-aksen tombol-penuh" type="submit">Simpan password</button>
    </form>
    <p id="tautan-baru" hidden style="margin:16px 0 0"><a class="tombol tombol-utama" href="lupa-password.html">Minta tautan baru</a></p>
    <p id="ke-login" hidden style="margin:16px 0 0"><a class="tombol tombol-utama" href="login.html">Masuk</a></p>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/ui.js"></script>
<script src="js/guard.js"></script>
<script src="js/auth.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  // Disimpan sekarang karena Supabase menghapus data dari alamat halaman setelah dibaca
  const hashAwal = location.hash, queryAwal = location.search;
  const adaGalat = /error=|error_code=/.test(hashAwal) || /[?&]error=/.test(queryAwal);
  const dariTautan = /type=recovery/.test(hashAwal) || /[?&]code=/.test(queryAwal);
  let formTampil = false;

  function tampilForm() {
    if (formTampil) return;
    formTampil = true;
    $('tunggu').hidden = true;
    $('form').hidden = false;
  }
  function tampilGagal(teks) {
    $('tunggu').hidden = true;
    tampilPesan($('pesan'), teks, 'gagal');
    $('tautan-baru').hidden = false;
  }

  db.auth.onAuthStateChange((event) => { if (event === 'PASSWORD_RECOVERY') tampilForm(); });

  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = e.target.elements;
    const tombol = e.target.querySelector('button[type=submit]');
    $('pesan').hidden = true;
    if (f.password.value !== f.password2.value) return tampilPesan($('pesan'), 'Password dan ulangi password tidak sama.', 'gagal');
    tombolSibuk(tombol, true, 'Menyimpan...');
    const { error } = await db.auth.updateUser({ password: f.password.value });
    if (error) {
      const m = (error.message || '').toLowerCase();
      if (m.includes('different from the old')) tampilPesan($('pesan'), 'Password baru harus berbeda dari password lama.', 'gagal');
      else if (m.includes('session')) tampilGagal('Sesi tautan sudah berakhir. Minta tautan baru.');
      else tampilPesan($('pesan'), pesanError(error), 'gagal');
      return tombolSibuk(tombol, false);
    }
    await db.auth.signOut();  // keluar dari sesi sementara, lalu masuk lagi dengan password baru
    e.target.hidden = true;
    tampilPesan($('pesan'), 'Password berhasil diubah. Silakan masuk dengan password baru.', 'ok');
    $('ke-login').hidden = false;
  });

  (async () => {
    pasangHeader();
    if (adaGalat) return tampilGagal('Tautan ini sudah kedaluwarsa atau sudah pernah dipakai. Minta tautan baru.');
    if (!dariTautan) return tampilGagal('Halaman ini hanya bisa dibuka dari tautan di email. Minta tautan baru.');
    tampilLoading($('tunggu'));
    await new Promise((r) => setTimeout(r, 1500));
    if (!formTampil) {
      const { data: { session } } = await db.auth.getSession();
      if (session) tampilForm(); else tampilGagal('Tautan tidak valid. Minta tautan baru.');
    }
  })();
</script>
</body></html>
