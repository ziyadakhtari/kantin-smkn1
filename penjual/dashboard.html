<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<title>Kantin SMKN 1 Cimahi</title><link rel="stylesheet" href="../css/style.css"></head>
<body hidden>
<main class="container">
  <div class="kartu" style="margin-top:16px">
    <h1 id="sapaan">Halo</h1>
    <p class="lembut">Kamu masuk sebagai penjual. Dashboard pesanan dibuat di langkah berikutnya.</p>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/guard.js"></script>
<script src="../js/auth.js"></script>
<script>
  (async () => {
    pasangHeader(true);
    const profil = await wajibPeran('penjual');
    if (!profil) return;
    document.getElementById('sapaan').textContent = 'Halo, ' + profil.nama;
    document.body.hidden = false;
  })();
</script>
</body></html>
