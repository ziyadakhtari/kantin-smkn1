<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<title>Daftar Penjual - SkipAntre</title><link rel="stylesheet" href="css/style.css"></head>
<body class="hal-auth">
<main class="container">
  <div class="kartu kartu-auth kartu-auth--lebar">
    <a class="auth-merek" href="index.html">
      <img src="img/logo-smkn1.png" alt="Logo" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'logo-kosong',style:'width:44px;height:44px'}))">
      <span class="merek-teks"><b>Skip<span>Antre</span></b><small>Kantin SMKN 1 Cimahi</small></span>
    </a>
    <h1 class="auth-judul">Daftar sebagai penjual</h1>
    <p class="auth-sub lembut">Setelah daftar, akunmu perlu disetujui pengelola kantin sebelum bisa dipakai berjualan.</p>
    <div id="pesan" class="status-kotak" hidden></div>
    <form id="form-daftar">
      <div class="field-ganda">
        <div class="field"><label for="nama">Nama lengkap</label><input class="input" id="nama" name="nama" autocomplete="name" required></div>
        <div class="field"><label for="nama_kantin">Nama kantin / lapak</label><input class="input" id="nama_kantin" name="nama_kantin" required></div>
      </div>
      <div class="field-ganda">
        <div class="field"><label for="email">Email</label><input class="input" id="email" name="email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="no_hp">Nomor HP</label><input class="input" id="no_hp" name="no_hp" type="tel" inputmode="numeric" autocomplete="tel" required></div>
      </div>
      <div class="field-ganda">
        <div class="field"><label for="password">Password (min 8 karakter)</label><input class="input" id="password" name="password" type="password" minlength="8" autocomplete="new-password" required></div>
        <div class="field"><label for="password2">Ulangi password</label><input class="input" id="password2" name="password2" type="password" minlength="8" autocomplete="new-password" required></div>
      </div>
      <button class="tombol tombol-aksen tombol-penuh" type="submit">Daftar sebagai penjual</button>
    </form>
    <p class="auth-kaki">Sudah punya akun? <a href="login.html">Masuk</a></p>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/ui.js"></script>
<script src="js/guard.js"></script>
<script src="js/auth.js"></script>
<script>
  pasangHeader();
  document.getElementById('form-daftar').addEventListener('submit', prosesDaftarPenjual);
</script>
</body></html>
