<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<title>Daftar Pembeli - SkipAntre</title><link rel="stylesheet" href="css/style.css"></head>
<body class="hal-auth">
<main class="container">
  <div class="kartu kartu-auth kartu-auth--lebar">
    <a class="auth-merek" href="index.html">
      <img src="img/logo-smkn1.png" alt="Logo" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'logo-kosong',style:'width:44px;height:44px'}))">
      <span class="merek-teks"><b>Skip<span>Antre</span></b><small>Kantin SMKN 1 Cimahi</small></span>
    </a>
    <h1 class="auth-judul">Daftar untuk memesan</h1>
    <p class="auth-sub lembut">Untuk siswa, guru, dan pegawai SMK Negeri 1 Cimahi. Akun langsung aktif setelah daftar.</p>
    <div id="pesan" class="status-kotak" hidden></div>
    <form id="form-daftar">
      <div class="field-ganda">
        <div class="field"><label for="nama">Nama lengkap</label><input class="input" id="nama" name="nama" autocomplete="name" required></div>
        <div class="field"><label for="email">Email</label><input class="input" id="email" name="email" type="email" autocomplete="email" required></div>
      </div>
      <div class="field-ganda">
        <div class="field"><label for="jenis">Saya adalah</label>
          <select class="input" id="jenis" name="jenis" required>
            <option value="">Pilih...</option><option value="siswa">Siswa</option><option value="guru">Guru</option><option value="pegawai">Pegawai</option>
          </select></div>
        <div class="field" id="kotak-kelas" hidden><label for="kelas">Kelas / jurusan</label><input class="input" id="kelas" name="kelas" placeholder="contoh: XI RPL 1"></div>
      </div>
      <div class="field-ganda">
        <div class="field"><label for="password">Password (min 8 karakter)</label><input class="input" id="password" name="password" type="password" minlength="8" autocomplete="new-password" required></div>
        <div class="field"><label for="password2">Ulangi password</label><input class="input" id="password2" name="password2" type="password" minlength="8" autocomplete="new-password" required></div>
      </div>
      <button class="tombol tombol-aksen tombol-penuh" type="submit">Daftar</button>
    </form>
    <p class="auth-kaki">Sudah punya akun? <a href="login.html">Masuk</a></p>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/ui.js"></script>
<script src="js/guard.js"></script>
<script src="js/auth.js"></script>
<script>
  pasangHeader();
  const jenis = document.getElementById('jenis'), kotak = document.getElementById('kotak-kelas'), kelas = document.getElementById('kelas');
  jenis.addEventListener('change', () => { const siswa = jenis.value === 'siswa'; kotak.hidden = !siswa; kelas.required = siswa; });
  document.getElementById('form-daftar').addEventListener('submit', prosesDaftarPembeli);
</script>
</body></html>
