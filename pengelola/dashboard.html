<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<title>Dashboard Pengelola - Kantin SMKN 1 Cimahi</title><link rel="stylesheet" href="../css/style.css"></head>
<body hidden>
<main class="container">
  <h1 id="sapaan" style="font-size:1.8rem;margin-top:12px">Halo</h1>
  <div class="baris-tombol" style="margin-bottom:16px">
    <a class="tombol tombol-aksen" href="persetujuan.html">Persetujuan penjual <span id="lencana-tunggu"></span></a>
    <a class="tombol tombol-utama" href="akun.html">Kelola akun</a>
    <a class="tombol tombol-utama" href="pengumuman.html">Pengumuman</a>
  </div>
  <div id="hasil"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/guard.js"></script>
<script>
  const $ = (id) => document.getElementById(id);

  async function muat(awal) {
    if (awal) tampilLoading($('hasil'));
    const { data, error } = await db.rpc('ringkasan_kantin');
    if (error) { if (awal) tampilKosong($('hasil'), 'Ringkasan gagal dimuat', error.message); return; }
    gambar(data);
  }

  function gambar(d) {
    const t = d.total;
    $('lencana-tunggu').innerHTML = t.penjual_menunggu ? '<span class="label" style="background:#fff;color:#a34a00">' + t.penjual_menunggu + '</span>' : '';
    const stat = (judul, nilai) => '<div class="kartu" style="padding:14px"><div class="lembut">' + judul + '</div><div style="font-size:1.5rem;font-weight:800;color:var(--utama)">' + nilai + '</div></div>';
    $('hasil').innerHTML =
      '<div style="display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:20px">' +
        stat('Kantin buka', t.kantin_buka + ' dari ' + t.kantin_aktif) +
        stat('Pesanan hari ini', t.pesanan_hari_ini) +
        stat('Penjual menunggu', t.penjual_menunggu) +
        stat('Pembeli aktif', t.pembeli_aktif) +
      '</div><h2>Semua kantin</h2>' +
      (d.kantin.length ? d.kantin.map((k) => {
        const label = k.status_akun !== 'aktif' ? '<span class="label label-habis">Dinonaktifkan</span>'
          : k.sedang_buka ? '<span class="label label-sukses">Buka</span>' : '<span class="label label-habis">Tutup</span>';
        return '<div class="kartu" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><strong>' + aman(k.nama_kantin) + '</strong>' + label + '</div>' +
          '<p class="lembut" style="margin:4px 0">Pemilik: ' + aman(k.pemilik) + '</p>' +
          '<p style="margin:0"><strong>' + k.pesanan_hari_ini + '</strong> pesanan hari ini (' + k.selesai_hari_ini + ' selesai)</p></div>';
      }).join('') : '<div class="kartu"><div class="kosong"><strong>Belum ada kantin</strong>Kantin muncul setelah penjual disetujui.</div></div>');
  }

  (async () => {
    pasangHeader(true);
    const profil = await wajibPeran('pengelola');
    if (!profil) return;
    $('sapaan').textContent = 'Halo, ' + profil.nama;
    document.body.hidden = false;
    muat(true);
    setInterval(() => muat(false), 60000);
  })();
</script>
</body></html>
